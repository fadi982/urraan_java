
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Age to Days Converter</title>
</head>
<body class=" grid justify-center mt-4">
        <div class="border-4 w-70 bg-yellow-200 ">
    <h1 class="py-8 px-8  text-lg font-bold  ">Age to Days Converter</h1>

    <label class="" for="age">Enter your age in years:</label>
    <input class="border  w-60  " type="number" id="age" placeholder="Enter age">

    <button class="border w-20 mt-4 bg-red-900 text-white" onclick="convertAge()">Convert</button>

    <h3 class="mt-4" id="result"></h3>

   
   </div>
   <script>
            function convertAge(){
            let age  =document.getElementById("age").value;

if(age === "" || Number(age) < 0){
    document.getElementById("result") .innerText =
    "Please enter valid age";
    return;
}       
          let days =Number(age) *365;
          document.getElementById("result").innerText =
          "Your age in days is:" +days;
}
   </script>

   
</body>
</html>
